name: MoritonEmch
options:
  bundleIdPrefix: mn.moriton
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: "FCY9Y2B5SG"
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "0.2"
    CURRENT_PROJECT_VERSION: "2"
    TARGETED_DEVICE_FAMILY: "1"
targets:
  MoritonEmch:
    type: application
    platform: iOS
    sources: [MoritonEmch]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: mn.moriton.emch
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    info:
      path: MoritonEmch/Info.plist
      properties:
        CFBundleDisplayName: Морьтон Эмч
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIBackgroundModes: [remote-notification]
        ITSAppUsesNonExemptEncryption: false
        NSCameraUsageDescription: Үзсэн адууны зургийг авч үзлэгийн бичлэгт хавсаргана.
        NSPhotoLibraryUsageDescription: Адууны зургийг сонгож үзлэгийн бичлэгт хавсаргана.
    entitlements:
      path: MoritonEmch/MoritonEmch.entitlements
      properties:
        aps-environment: development
